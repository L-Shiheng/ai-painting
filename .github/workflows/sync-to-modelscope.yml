name: Sync to ModelScope

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to ModelScope
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          # 配置 Git 用户信息
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 添加魔搭远程仓库地址，认证用户名必须为 oauth2
          git remote add modelscope https://oauth2:${MS_TOKEN}@www.modelscope.cn/studios/shengluo01/ai-painting.git
          
          # 强制推送到魔搭的 main 分支
          git push modelscope main -f
