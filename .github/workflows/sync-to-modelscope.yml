name: Sync to ModelScope

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to ModelScope
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -e
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # 用 GitHub 当前提交强制覆盖 ModelScope 的 master 分支
          git push --force \
            https://oauth2:${MS_TOKEN}@www.modelscope.cn/studios/shengluo01/ai-painting.git \
            HEAD:master
