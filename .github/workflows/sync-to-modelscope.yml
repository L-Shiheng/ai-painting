name: Sync to ModelScope

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to ModelScope
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 直接把当前 commit 强制推送到魔搭的 master 分支
          # 格式为：HEAD:master
          git push -f https://oauth2:${MS_TOKEN}@www.modelscope.cn/studios/shengluo01/ai-painting.git HEAD:master
