name: Sync to ModelScope

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to ModelScope (sync branch)
        env:
          MS_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: |
          set -e
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # 关键改动：推送到 github-sync 分支，而不是 master
          git push --force \
            https://oauth2:${MS_TOKEN}@www.modelscope.cn/studios/shengluo01/ai-painting.git \
            HEAD:github-sync
